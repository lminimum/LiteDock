x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  APP_NAME: ${APP_NAME:-LiteDock}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  # HTTP settings
  HTTP_PORT: ${HTTP_PORT:-8080}
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  # Database (default: SQLite)
  DB_TYPE: ${DB_TYPE:-sqlite}
  DB_POOL_MAX: ${DB_POOL_MAX:-1}
  DB_URL: ${DB_URL:-/data/litedock.db}
  # Auth
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  # Metrics
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  # Swagger
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

services:
  litedock:
    container_name: litedock
    platform: linux/amd64
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    volumes:
      - ${SQLITE_DIR:-./sqlite}:/data
    ports:
      - "${APP_PORT:-3023}:80"

