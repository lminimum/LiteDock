version: "3.9"

x-db-environment: &x-db-environment
  POSTGRES_SSL_MODE: "disable"
  POSTGRES_HOST: "pgdb"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "litedock"
  POSTGRES_PASSWORD: "litedock"
  POSTGRES_USER: "litedock"

x-backend-app-environment: &x-backend-app-environment
  GOMAXPROCS: "1"
  APP_NAME: "LiteDock"
  APP_VERSION: "1.0.0"
  # HTTP settings
  HTTP_PORT: "8080"
  HTTP_USE_PREFORK_MODE: "false"
  # Logger
  LOG_LEVEL: "debug"
  # Database
  DB_TYPE: "postgres"
  DB_POOL_MAX: "2"
  DB_URL: "postgres://litedock:litedock@pgdb:5432/litedock"
  # SQLite (for local development)
  SQLITE_DSN: "./data.db"
  # Metrics
  METRICS_ENABLED: "true"
  # Swagger
  SWAGGER_ENABLED: "true"

services:
  pgdb:
    container_name: pgdb
    image: postgres:18.1-alpine
    environment:
      <<: *x-db-environment
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      app_network:
        aliases:
          - db.lvh.me

  mysql:
    container_name: mysql
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: litedock
      MYSQL_DATABASE: litedock
      MYSQL_USER: litedock
      MYSQL_PASSWORD: litedock
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      app_network:
        aliases:
          - mysql.lvh.me

  app:
    container_name: app
    platform: linux/amd64
    pid: "host"
    build:
      context: .
    environment:
      <<: *x-backend-app-environment
    ports:
      - "8080:8080"
    depends_on:
      - pgdb
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: '2Gb'
        reservations:
          cpus: '0.60'
          memory: '1Gb'
    networks:
      app_network:
        aliases:
          - app.lvh.me

  nginx:
    container_name: nginx
    image: nginx:1.29.8-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      app_network:
        aliases:
          - nginx.lvh.me

networks:
  app_network:
    external: false

volumes:
  db_data:
  mysql_data:
