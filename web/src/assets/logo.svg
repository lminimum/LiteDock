<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Container boxes stacked in dock formation -->
  <!-- Back container (top-left) -->
  <rect x="4" y="4" width="12" height="10" rx="1" fill="#1a1a2e" stroke="#E8F5C8" stroke-width="1.5"/>
  <rect x="6" y="6" width="8" height="2" rx="0.5" fill="#E8F5C8" opacity="0.4"/>
  <rect x="6" y="9" width="5" height="2" rx="0.5" fill="#E8F5C8" opacity="0.25"/>

  <!-- Middle container (top-right, slightly overlapping) -->
  <rect x="10" y="7" width="12" height="10" rx="1" fill="#1a1a2e" stroke="#C4E08F" stroke-width="1.5"/>
  <rect x="12" y="9" width="8" height="2" rx="0.5" fill="#C4E08F" opacity="0.5"/>
  <rect x="12" y="12" width="5" height="2" rx="0.5" fill="#C4E08F" opacity="0.3"/>

  <!-- Front container (bottom, main focus) -->
  <rect x="6" y="14" width="20" height="14" rx="1.5" fill="#1a1a2e" stroke="#E8F5C8" stroke-width="1.5"/>
  <!-- Dock lines inside front container -->
  <rect x="9" y="17" width="14" height="2.5" rx="0.75" fill="#E8F5C8" opacity="0.6"/>
  <rect x="9" y="20.5" width="9" height="2" rx="0.5" fill="#E8F5C8" opacity="0.35"/>
  <rect x="9" y="23.5" width="11" height="2" rx="0.5" fill="#E8F5C8" opacity="0.35"/>
  <!-- Dock icon accent dot -->
  <circle cx="23" cy="21.5" r="1.5" fill="#E8F5C8"/>
</svg>