basePath: /v1
definitions:
  entity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  v1.CreateComposeRequest:
    properties:
      content:
        type: string
      file_path:
        type: string
      name:
        type: string
    required:
    - content
    - name
    type: object
  v1.CreateContainerRequest:
    properties:
      cmd:
        items:
          type: string
        type: array
      env:
        items:
          type: string
        type: array
      image:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      network:
        type: string
      ports:
        items:
          type: string
        type: array
      volumes:
        items:
          type: string
        type: array
    required:
    - image
    type: object
  v1.CreateMachineRequest:
    properties:
      auth_method:
        enum:
        - password
        - key
        type: string
      docker_host:
        type: string
      host:
        type: string
      name:
        type: string
      password:
        type: string
      port:
        type: integer
      ssh_key:
        type: string
      ssh_key_path:
        type: string
      username:
        type: string
    required:
    - auth_method
    - host
    - name
    - username
    type: object
  v1.CreateNetworkRequest:
    properties:
      driver:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  v1.CreateVolumeRequest:
    properties:
      driver:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  v1.ExecRequest:
    properties:
      cmd:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - cmd
    type: object
  v1.PullImageRequest:
    properties:
      repository:
        type: string
      tag:
        type: string
    required:
    - repository
    type: object
  v1.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  v1.UpdateComposeRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  v1.UpdateMachineRequest:
    properties:
      auth_method:
        enum:
        - password
        - key
        type: string
      docker_host:
        type: string
      host:
        type: string
      name:
        type: string
      password:
        type: string
      port:
        type: integer
      ssh_key:
        type: string
      ssh_key_path:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Docker container management platform
  title: LiteDock API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: User login
      tags:
      - auth
  /auth/me:
    get:
      description: Get the currently authenticated user's information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: User registration
      tags:
      - auth
  /auth/setup-status:
    get:
      description: Returns whether the system has been initially configured
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Check if initial setup is complete
      tags:
      - auth
  /containers:
    get:
      description: Get all Docker containers from all machines
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.Response'
      summary: List all containers
      tags:
      - containers
  /containers/{id}:
    get:
      description: Get details of a specific Docker container (local)
      parameters:
      - description: Container ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get a container by ID
      tags:
      - containers
  /dashboard/resources:
    get:
      description: Get current CPU, memory, and disk usage metrics
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get current system resource metrics
      tags:
      - dashboard
  /dashboard/resources/history:
    get:
      description: Get historical metrics for the chart (last N minutes)
      parameters:
      - default: 5
        description: Number of minutes to look back
        in: query
        name: minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get historical system resources metrics
      tags:
      - dashboard
  /dashboard/resources/stream:
    get:
      description: WebSocket endpoint that streams current CPU, memory, and disk metrics
        every 2 seconds
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
      summary: Stream system resource metrics
      tags:
      - dashboard
  /dashboard/stats:
    get:
      description: Get aggregated stats for the dashboard (machine count, container
        counts)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get dashboard statistics
      tags:
      - dashboard
  /machines:
    get:
      description: Get all registered remote Docker hosts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List all remote machines
      tags:
      - machines
    post:
      consumes:
      - application/json
      description: Add a new remote Docker host to manage
      parameters:
      - description: Machine creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateMachineRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new remote machine
      tags:
      - machines
  /machines/{id}:
    delete:
      description: Remove a remote Docker host from management
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a remote machine
      tags:
      - machines
    get:
      description: Get details of a specific remote Docker host
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a remote machine by ID
      tags:
      - machines
    put:
      consumes:
      - application/json
      description: Update an existing remote Docker host
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Machine update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateMachineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a remote machine
      tags:
      - machines
  /machines/{id}/compose:
    get:
      description: Get all Docker Compose projects on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Compose projects
      tags:
      - compose
    post:
      consumes:
      - application/json
      description: Create a Docker Compose project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateComposeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a Compose project
      tags:
      - compose
  /machines/{id}/compose/{name}:
    delete:
      description: Delete a Docker Compose project from a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a Compose project
      tags:
      - compose
    get:
      description: Get Docker Compose project details from a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get a Compose project
      tags:
      - compose
    put:
      consumes:
      - application/json
      description: Update Docker Compose project content on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      - description: Compose project update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateComposeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a Compose project
      tags:
      - compose
  /machines/{id}/compose/{name}/build:
    post:
      description: Run docker compose build for a project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Build Compose project images
      tags:
      - compose
  /machines/{id}/compose/{name}/down:
    post:
      description: Run docker compose down for a project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      - default: false
        description: Remove named volumes
        in: query
        name: volumes
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Stop and remove a Compose project
      tags:
      - compose
  /machines/{id}/compose/{name}/logs:
    get:
      description: Get logs for a Docker Compose project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Compose project logs
      tags:
      - compose
  /machines/{id}/compose/{name}/ps:
    get:
      description: List services and containers for a Docker Compose project on a
        remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List Compose project services
      tags:
      - compose
  /machines/{id}/compose/{name}/restart:
    post:
      description: Restart services for a Docker Compose project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Restart Compose services
      tags:
      - compose
  /machines/{id}/compose/{name}/start:
    post:
      description: Start services for a Docker Compose project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Start Compose services
      tags:
      - compose
  /machines/{id}/compose/{name}/stop:
    post:
      description: Stop services for a Docker Compose project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Stop Compose services
      tags:
      - compose
  /machines/{id}/compose/{name}/up:
    post:
      description: Run docker compose up for a project on a remote machine
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Compose project name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Start a Compose project
      tags:
      - compose
  /machines/{id}/containers:
    get:
      description: Get all Docker containers running on a remote host
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List containers on a remote machine
      tags:
      - machines
  /machines/{id}/containers/{containerId}:
    delete:
      description: Delete a Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      - default: false
        description: Force removal
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Remove a container
      tags:
      - machines
    get:
      description: Get detailed information about a Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Inspect a container
      tags:
      - machines
  /machines/{id}/containers/{containerId}/exec:
    post:
      consumes:
      - application/json
      description: Run a command inside a Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      - description: Command to execute
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.ExecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Execute command in container
      tags:
      - machines
  /machines/{id}/containers/{containerId}/kill:
    post:
      description: Force stop a Docker container with SIGKILL
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Kill a container
      tags:
      - machines
  /machines/{id}/containers/{containerId}/logs:
    get:
      description: Fetch Docker container logs
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      - default: "100"
        description: Number of lines to fetch
        in: query
        name: tail
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get container logs
      tags:
      - machines
  /machines/{id}/containers/{containerId}/pause:
    post:
      description: Pause a running Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Pause a container
      tags:
      - machines
  /machines/{id}/containers/{containerId}/restart:
    post:
      description: Restart a Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
      - description: Container ID
        in: path
        name: containerId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Restart a container
      tags:
      - machines
  /machines/{id}/containers/{containerId}/start:
    post:
      description: Start a stopped Docker container
      parameters:
      - description: Machine ID
        in: path
        name: id
        required: true
        type: string
