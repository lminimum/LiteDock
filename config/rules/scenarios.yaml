scenarios:
  - name: "WebApplication"
    description: "Web 应用典型部署场景"
    recommendations:
      - key: "健康检查"
        value: "/healthz"
        reason: "实时监控应用可用性，及时发现故障节点"
      - key: "日志聚合"
        value: "stdout/stderr → ELK"
        reason: "集中管理日志，便于排查问题和审计"
      - key: "副本数"
        value: "min: 2, max: 10"
        reason: "保证高可用性和负载能力"
      - key: "资源限制"
        value: "CPU: 0.5-2, Memory: 512MB-2GB"
        reason: "防止单个容器占用过多资源影响其他服务"

  - name: "Database"
    description: "数据库服务部署场景"
    recommendations:
      - key: "持久化存储"
        value: "绑定宿主机目录或命名卷"
        reason: "确保数据不随容器删除而丢失"
      - key: "环境变量"
        value: "禁止明文密码，使用 secrets"
        reason: "保护敏感数据安全"
      - key: "资源保证"
        value: "CPU: 1-4, Memory: 1GB-8GB"
        reason: "数据库需要稳定足够的资源保证性能"
      - key: "备份策略"
        value: "定时快照 + 异地备份"
        reason: "防止数据丢失，保证业务连续性"

  - name: "Cache"
    description: "缓存服务（Redis/Memcached）部署场景"
    recommendations:
      - key: "内存限制"
        value: "maxmemory-policy: allkeys-lru"
        reason: "防止内存溢出，保证服务稳定性"
      - key: "持久化"
        value: "RDB + AOF"
        reason: "防止缓存数据丢失，加速重启恢复"
      - key: "集群模式"
        value: "哨兵或集群模式"
        reason: "保证高可用，避免单点故障"
      - key: "连接池"
        value: "合理配置 maxclients"
        reason: "防止连接数耗尽导致服务不可用"

  - name: "MessageQueue"
    description: "消息队列服务（RabbitMQ/NATS）部署场景"
    recommendations:
      - key: "队列持久化"
        value: "durable: true"
        reason: "确保消息不因服务器重启而丢失"
      - key: "内存管理"
        value: "vm_memory_high_watermark: 0.6"
        reason: "防止内存溢出，保护服务质量"
      - key: "高可用"
        value: "镜像队列 + 故障转移"
        reason: "保证消息传递的可靠性"
      - key: "消费者确认"
        value: "manual_ack: true"
        reason: "确保消息被正确处理后再删除"
